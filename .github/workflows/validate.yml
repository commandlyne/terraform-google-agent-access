name: validate

# Customers pin tags, but main must stay applyable at every commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - run: terraform fmt -check -recursive -diff

      - name: validate + test module
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit
        run: |
          tflint --init
          tflint --recursive

      - name: validate examples/basic
        working-directory: examples/basic
        run: |
          terraform init -backend=false -input=false
          terraform validate
